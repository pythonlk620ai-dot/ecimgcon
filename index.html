<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Redirect - Easy Img Converter</title>
    <script>
        (function() {
            const browserLang = navigator.language || navigator.userLanguage;
            
            if (browserLang === 'zh-TW' || browserLang === 'zh-HK' || browserLang === 'zh-MO') {
                window.location.href = './zh-tw/index.html';
            } else {
                window.location.href = './en/index.html';
            }
        })();
    </script>
</head>
<body>
    <p>Redirecting to the appropriate language version...</p>
</body>
</html>
