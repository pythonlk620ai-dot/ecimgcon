<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9279932937238095"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Redirect</title>
    <script>
        (function() {
            const browserLang = navigator.language || navigator.userLanguage;
            
            if (browserLang.startsWith('ko')) {
                window.location.href = './ko/index.html';
            } else if (browserLang.startsWith('zh-TW') || browserLang.startsWith('zh-HK') || browserLang.startsWith('zh-MO')) {
                window.location.href = './zh-TW/index.html';
            } else if (browserLang.startsWith('ja')) {
                window.location.href = './ja/index.html';
            } else if (browserLang.startsWith('zh')) {
                window.location.href = './zh-CN/index.html';
            } else {
                window.location.href = './en/index.html';
            }
        })();
    </script>
</head>
<body>
    <p>Redirecting to the appropriate language version...</p>
</body>
</html>
