        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('file-input');
        const settingsContainer = document.getElementById('settingsContainer');
        const qualityBtns = document.querySelectorAll('.quality-btn');
        const convertAllBtn = document.getElementById('convertAllBtn');
        const fileList = document.getElementById('fileList');
        const statusContainer = document.getElementById('statusContainer');
        const statusText = document.getElementById('statusText');
        const progressFill = document.getElementById('progressFill');
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });
        
        qualityBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                qualityBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                outputQuality = btn.dataset.quality;
            });
        });
        
        function handleFiles(newFiles) {
            const pdfFilesArray = Array.from(newFiles).filter(file => file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf'));
            
            if (pdfFilesArray.length > 0) {
                settingsContainer.style.display = 'block';
                pdfFiles = pdfFilesArray;
                renderFileList();
            } else {
                alert('Please select PDF files only! 📄');
            }
        }
        
        function renderFileList() {
            fileList.style.display = 'block';
            fileList.innerHTML = '';
            
            pdfFiles.forEach((file, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `
                    <div class="file-header">
                        <span class="file-name">${file.name}</span>
                        <div class="file-info">
                            <span>📄 ${file.type}</span>
                            <span>📊 ${(file.size / 1024).toFixed(2)} KB</span>
                        </div>
                    </div>
                    <div class="file-actions">
                        <button class="action-btn convert-file-btn" onclick="convertSingleFile(${index})">Convert This 🔄</button>
                        <button class="action-btn remove-btn" onclick="removeFile(${index})">❌ Remove</button>
                    </div>
                `;
                fileList.appendChild(fileItem);
            });
            
            convertAllBtn.disabled = pdfFiles.length === 0;
        }
        
        window.removeFile = function(index) {
            pdfFiles.splice(index, 1);
            renderFileList();
        };
        
        window.convertSingleFile = async function(index) {
            const file = pdfFiles[index];
            statusContainer.style.display = 'block';
            statusText.textContent = `Converting ${file.name}... ⏳`;
            progressFill.style.width = '0%';
            
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                const totalPages = pdf.numPages;
                const convertedPages = [];
                
                for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const viewport = page.getViewport({ scale: qualitySettings[outputQuality].scale });
                    
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    
                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                    
                    canvas.toBlob((blob) => {
                        const jpgFile = new File([blob], `${file.name.replace('.pdf', '')}_page_${pageNum}.jpg`, { type: 'image/jpeg' });
                        convertedPages.push(jpgFile);
                        
                        if (convertedPages.length === totalPages) {
                            showDownloadOptions(convertedPages);
                        }
                        
                        const progress = (pageNum / totalPages) * 100;
                        progressFill.style.width = `${progress}%`;
                    }, 'image/jpeg', qualitySettings[outputQuality].quality);
                }
                
                statusText.textContent = 'Conversion Complete! ✅';
            } catch (error) {
                console.error('Error converting file:', error);
                statusText.textContent = 'Error converting file! ❌';
            }
        };
        
        convertAllBtn.addEventListener('click', async () => {
            if (pdfFiles.length === 0) return;
            
            statusContainer.style.display = 'block';
            statusText.textContent = 'Converting all PDFs... ⏳';
            progressFill.style.width = '0%';
            
            const zip = new JSZip();
            let totalFiles = 0;
            
            for (let fileIndex = 0; fileIndex < pdfFiles.length; fileIndex++) {
                const file = pdfFiles[fileIndex];
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                const totalPages = pdf.numPages;
                totalFiles += totalPages;
                
                for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const viewport = page.getViewport({ scale: qualitySettings[outputQuality].scale });
                    
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    
                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                    
                    canvas.toBlob((blob) => {
                        const jpgFile = new File([blob], `${file.name.replace('.pdf', '')}_page_${pageNum}.jpg`, { type: 'image/jpeg' });
                        zip.file(jpgFile.name, blob);
                        
                        const progress = ((fileIndex * totalPages + pageNum) / totalFiles) * 100;
                        progressFill.style.width = `${progress}%`;
                        
                        if (progress === 100) {
                            statusText.textContent = 'Conversion Complete! ✅';
                            setTimeout(() => {
                                zip.generateAsync({ type: 'blob' }).then(content => {
                                    const url = URL.createObjectURL(content);
                                    const a = document.createElement('a');
                                    a.href = url;
                                    a.download = 'converted-pdf-pages.zip';
                                    document.body.appendChild(a);
                                    a.click();
                                    document.body.removeChild(a);
                                    URL.revokeObjectURL(url);
                                });
                            }, 500);
                        }
                    }, 'image/jpeg', qualitySettings[outputQuality].quality);
                }
            }
        });
        
        function showDownloadOptions(pages) {
            const downloadSection = document.createElement('div');
            downloadSection.className = 'download-section';
            
            const downloadAllBtn = document.createElement('button');
            downloadAllBtn.className = 'download-all-btn';
            downloadAllBtn.textContent = '📥 Download All Pages';
            downloadAllBtn.onclick = () => {
                const zip = new JSZip();
                pages.forEach(page => {
                    zip.file(page.name, page);
                });
                
                zip.generateAsync({ type: 'blob' }).then(content => {
                    const url = URL.createObjectURL(content);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'converted-pages.zip';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                });
            };
            downloadSection.appendChild(downloadAllBtn);
            
            pages.forEach(page => {
                const downloadBtn = document.createElement('button');
                downloadBtn.className = 'download-all-btn';
                downloadBtn.textContent = `📥 Download ${page.name}`;
                downloadBtn.style.marginTop = '10px';
                downloadBtn.onclick = () => {
                    const url = URL.createObjectURL(page);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = page.name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                };
                downloadSection.appendChild(downloadBtn);
            });
            
            statusContainer.appendChild(downloadSection);
        }
    </script>
</body>
</html>
