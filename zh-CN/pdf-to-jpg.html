    <div class="container">
        <header>
            <h1>PDF 转 JPG 转换器 🎨</h1>
            <p class="description">试试我们快速的 PDF 转 JPG 转换器，立即将 PDF 文件转换为 JPG 文件。快速、安全！✨</p>
            <p class="privacy-note">🔒 您的隱私受到保護！不會傳輸或儲存任何資料。</p>
        </header>
        
        <div class="converter-section">
            <div class="upload-area" id="uploadArea">
                <svg class="pdf-icon" viewBox="0 0 24 24">
                    <path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8.5 7.5c0 .83-.67 1.5-1.5 1.5H9v2H7.5V7H10c.83 0 1.5.67 1.5 1.5v1zm5 2c0 .83-.67 1.5-1.5 1.5h-2.5V7H15c.83 0 1.5.67 1.5 1.5v3zm4-3H19v1h1.5V11H19v2h-1.5V7h3v1.5zM9 9.5h1v-1H9v1zM4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm10 5.5h1v-3h-1v3z"/>
                </svg>
                <div class="upload-title">拖曳、上傳或貼上 PDF 📄</div>
                <div class="upload-subtitle">一次最多上传 3 个 PDF 文件 ⚡</div>
                <label for="file-input" class="browse-btn">
                    <svg viewBox="0 0 24 24">
                        <path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/>
                    </svg>
                    瀏覽檔案 📂
                </label>
                <input type="file" id="file-input" accept=".pdf" multiple>
            </div>
            
            <div class="settings-container" id="settingsContainer">
                <h3 class="settings-title">轉換設定 ⚙️</h3>
                
                <div class="quality-setting">
                    <label>輸出品質：</label>
                    <div class="quality-options">
                        <button class="quality-btn active" data-quality="high">高品质 🌟</button>
                        <button class="quality-btn" data-quality="medium">中品质 📸</button>
                        <button class="quality-btn" data-quality="low">低品质 ⚡</button>
                    </div>
                </div>
                
                <button class="convert-btn" id="convertAllBtn">轉換所有 PDF 🎯</button>
            </div>
            
            <div class="file-list" id="fileList"></div>
            
            <div class="status-container" id="statusContainer">
                <div class="status-text" id="statusText">轉換中... ⏳</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        
        let pdfFiles = [];
        let outputQuality = 'high';
        let qualitySettings = {
            high: { scale: 2, quality: 0.95 },
            medium: { scale: 1.5, quality: 0.8 },
            low: { scale: 1, quality: 0.6 }
        };
        
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('file-input');
        const settingsContainer = document.getElementById('settingsContainer');
        const qualityBtns = document.querySelectorAll('.quality-btn');
        const convertAllBtn = document.getElementById('convertAllBtn');
        const fileList = document.getElementById('fileList');
        const statusContainer = document.getElementById('statusContainer');
        const statusText = document.getElementById('statusText');
        const progressFill = document.getElementById('progressFill');
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });
        
        qualityBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                qualityBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                outputQuality = btn.dataset.quality;
            });
        });
        
        function handleFiles(newFiles) {
            const pdfFilesArray = Array.from(newFiles).filter(file => file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf'));
            
            if (pdfFilesArray.length > 0) {
                settingsContainer.style.display = 'block';
                pdfFiles = pdfFilesArray;
                renderFileList();
            } else {
                alert('请仅选择 PDF 文件！📄');
            }
        }
        
        function renderFileList() {
            fileList.style.display = 'block';
            fileList.innerHTML = '';
            
            pdfFiles.forEach((file, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `
                    <div class="file-header">
                        <span class="file-name">${file.name}</span>
                        <div class="file-info">
                            <span>📄 ${file.type}</span>
                            <span>📊 ${(file.size / 1024).toFixed(2)} KB</span>
                        </div>
                    </div>
                    <div class="file-actions">
                        <button class="action-btn convert-file-btn" onclick="convertSingleFile(${index})">轉換此檔案 🔄</button>
                        <button class="action-btn remove-btn" onclick="removeFile(${index})">❌ 移除</button>
                    </div>
                `;
                fileList.appendChild(fileItem);
            });
            
            convertAllBtn.disabled = pdfFiles.length === 0;
        }
        
        window.removeFile = function(index) {
            pdfFiles.splice(index, 1);
            renderFileList();
        };
        
        window.convertSingleFile = async function(index) {
            const file = pdfFiles[index];
            statusContainer.style.display = 'block';
            statusText.textContent = `转换 ${file.name} 中... ⏳`;
            progressFill.style.width = '0%';
            
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                const totalPages = pdf.numPages;
                const convertedPages = [];
                
                for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const viewport = page.getViewport({ scale: qualitySettings[outputQuality].scale });
                    
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    
                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                    
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', qualitySettings[outputQuality].quality));
                    const jpgFile = new File([blob], `${file.name.replace('.pdf', '')}_page_${pageNum}.jpg`, { type: 'image/jpeg' });
                    convertedPages.push({ file: jpgFile, blob: blob });
                    
                    const progress = (pageNum / totalPages) * 100;
                    progressFill.style.width = `${progress}%`;
                }
                
                statusText.textContent = '轉換完成！✅';
                showDownloadOptions(convertedPages);
            } catch (error) {
                console.error('轉換檔案時出錯:', error);
                statusText.textContent = '轉換檔案時出錯！❌';
            }
        };
        
        convertAllBtn.addEventListener('click', async () => {
            if (pdfFiles.length === 0) return;
            
            statusContainer.style.display = 'block';
            statusText.textContent = '轉換所有 PDF 中...⏳';
            progressFill.style.width = '0%';
            
            const zip = new JSZip();
            let totalFiles = 0;
            let completedFiles = 0;
            
            // Count total pages first
            for (let fileIndex = 0; fileIndex < pdfFiles.length; fileIndex++) {
                const file = pdfFiles[fileIndex];
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                totalFiles += pdf.numPages;
            }
            
            // Convert all files
            for (let fileIndex = 0; fileIndex < pdfFiles.length; fileIndex++) {
                const file = pdfFiles[fileIndex];
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                const totalPages = pdf.numPages;
                
                for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const viewport = page.getViewport({ scale: qualitySettings[outputQuality].scale });
                    
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    
                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                    
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', qualitySettings[outputQuality].quality));
                    const jpgFile = new File([blob], `${file.name.replace('.pdf', '')}_page_${pageNum}.jpg`, { type: 'image/jpeg' });
                    zip.file(jpgFile.name, blob);
                    
                    completedFiles++;
                    const progress = (completedFiles / totalFiles) * 100;
                    progressFill.style.width = `${progress}%`;
                }
            }
            
            statusText.textContent = '轉換完成！✅';
            showDownloadOptions(allConvertedPages);
        });
        
        let allConvertedPages = [];
        
        convertAllBtn.addEventListener('click', async () => {
            if (pdfFiles.length === 0) return;
            
            statusContainer.style.display = 'block';
            statusText.textContent = '轉換所有 PDF 中...⏳';
            progressFill.style.width = '0%';
            
            const zip = new JSZip();
            let totalFiles = 0;
            let completedFiles = 0;
            allConvertedPages = [];
            
            // Count total pages first
            for (let fileIndex = 0; fileIndex < pdfFiles.length; fileIndex++) {
                const file = pdfFiles[fileIndex];
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                totalFiles += pdf.numPages;
            }
            
            // Convert all files
            for (let fileIndex = 0; fileIndex < pdfFiles.length; fileIndex++) {
                const file = pdfFiles[fileIndex];
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                const totalPages = pdf.numPages;
                
                for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const viewport = page.getViewport({ scale: qualitySettings[outputQuality].scale });
                    
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    
                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                    
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', qualitySettings[outputQuality].quality));
                    const jpgFile = new File([blob], `${file.name.replace('.pdf', '')}_page_${pageNum}.jpg`, { type: 'image/jpeg' });
                    zip.file(jpgFile.name, blob);
                    allConvertedPages.push({ file: jpgFile, blob: blob, zip: zip });
                    
                    completedFiles++;
                    const progress = (completedFiles / totalFiles) * 100;
                    progressFill.style.width = `${progress}%`;
                }
            }
            
            statusText.textContent = '轉換完成！✅';
            showDownloadOptions(allConvertedPages);
        });
        
        function showDownloadOptions(pages) {
            // Clear existing download section if any
            const existingDownloadSection = statusContainer.querySelector('.download-section');
            if (existingDownloadSection) {
                existingDownloadSection.remove();
            }
            
            const downloadSection = document.createElement('div');
            downloadSection.className = 'download-section';
            
            const downloadAllBtn = document.createElement('button');
            downloadAllBtn.className = 'download-all-btn';
            downloadAllBtn.textContent = '📥 將所有頁面下載為 ZIP';
            downloadAllBtn.style.marginBottom = '15px';
            downloadAllBtn.onclick = () => {
                const zip = new JSZip();
                pages.forEach(page => {
                    zip.file(page.file.name, page.blob);
                });
                
                zip.generateAsync({ type: 'blob' }).then(content => {
                    const url = URL.createObjectURL(content);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'converted-pdf-pages.zip';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                });
            };
            downloadSection.appendChild(downloadAllBtn);
            
            // Show preview and download for each page
            pages.forEach((page, index) => {
                const previewContainer = document.createElement('div');
                previewContainer.style.cssText = 'background: white; border-radius: 15px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);';
                
                const previewImg = document.createElement('img');
                previewImg.src = URL.createObjectURL(page.blob);
                previewImg.style.cssText = 'width: 100%; max-width: 600px; height: auto; border-radius: 10px; display: block; margin: 0 auto 10px;';
                
                const fileName = document.createElement('p');
                fileName.textContent = page.file.name;
                fileName.style.cssText = 'text-align: center; font-weight: 700; color: #0288d1; margin: 10px 0;';
                
                const downloadBtn = document.createElement('button');
                downloadBtn.className = 'download-all-btn';
                downloadBtn.textContent = `📥 下載 ${page.file.name}`;
                downloadBtn.style.cssText = 'display: block; margin: 10px auto; width: auto;';
                downloadBtn.onclick = () => {
                    const url = URL.createObjectURL(page.file);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = page.file.name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                };
                
                previewContainer.appendChild(previewImg);
                previewContainer.appendChild(fileName);
                previewContainer.appendChild(downloadBtn);
                downloadSection.appendChild(previewContainer);
            });
            
            statusContainer.appendChild(downloadSection);
        }
    </script>
